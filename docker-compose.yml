services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: device-inventory-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: device_inventory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - device-inventory-network

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: device-inventory-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass changeme
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - device-inventory-network

  # Angie Reverse Proxy (nginx fork)
  angie:
    image: docker.angie.software/angie:latest
    container_name: device-inventory-angie
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Metrics endpoint
    volumes:
      - ./angie/angie.conf:/etc/angie/angie.conf:ro
      - ./angie/conf.d:/etc/angie/conf.d:ro
      - ./angie/certs:/etc/angie/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - device-inventory-network

  # pgAdmin - Database Management UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: device-inventory-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - device-inventory-network

networks:
  device-inventory-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
